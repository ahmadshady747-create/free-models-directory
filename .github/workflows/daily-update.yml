# Daily automation for the free-models directory — GitHub Actions ONLY.
# No Muse scheduled task runs this automation (removed 2026-11-28 at the
# owner's order: automation must live in Actions, not consume Muse quota).
#
# WHAT IT DOES (every day at 06:00 UTC = 08:00 Tripoli, plus manual dispatch):
#   1. Runs the health check in --network mode (link + content-hash check).
#   2. Fetches the latest AI news from 3 public RSS feeds into src/data/news.json.
#   3. Applies deterministic model-list maintenance ONLY
#      (scripts/update-models-daily.mjs): expires temporary offers whose
#      recorded offer_expires_at date has passed, with a changelog entry.
#      No limit, status, or entry is ever invented or changed by a script.
#   4. Verifies flagged pages with Gemini (scripts/verify-models-gemini.mjs,
#      only when the GEMINI_API_KEY repo secret is set): extracts the free
#      offer from each flagged official page and applies it ONLY with high
#      confidence + a verbatim quote from the page + numbers that appear in
#      that quote. A "no free offer" verdict is NEVER auto-applied — it goes
#      to the daily issue for a human decision. Without the secret this step
#      is skipped and the issue remains the fallback.
#   5. Rebuilds the site to prove it still builds with the new data.
#   6. Commits ONLY src/data/news.json, src/data/apis.json,
#      src/data/changelog.json and src/data/content-hashes.json when they
#      changed (hashes change only for pages Gemini verified this run).
#   7. Opens ONE GitHub issue when the health check finds changed pages or
#      pages needing review, cross-referenced with what Gemini did.
#   8. Deploys to Cloudflare Pages — ONLY when the repo secrets
#      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set (see below).
#
# WHAT IT NEVER DOES:
#   - Never invents a free limit, an expiry date, or an offer. An unstated
#     limit stays "غير مؤكد". An ended free offer keeps its entry with an
#     honest note and is never deleted silently; deletion needs the owner.
#   - Never runs --update-hashes: a content hash is updated only for a page
#     Gemini verified in the same run, using the same extraction and SHA-256
#     as the health check — never for unverified pages.
#   - Never deletes entries or wipes the news: if all RSS feeds fail, the
#     fetch script keeps the previous news.json untouched.
#
# SETUP (repo owner, once) for full automation:
#   Settings → Secrets and variables → Actions → New repository secret:
#     CLOUDFLARE_API_TOKEN    (a Cloudflare API token with Pages edit rights;
#                              create a dedicated token, least privilege)
#     CLOUDFLARE_ACCOUNT_ID   (the account ID shown in the Cloudflare dashboard)
#     GEMINI_API_KEY          (a Google AI Studio / Gemini API key; enables
#                              step 4. Without it, limit verification waits
#                              for the daily issue instead.)
#   Without the Cloudflare secrets the deploy step is skipped and the
#   workflow still succeeds — data and the health issue are updated, but
#   the live site only changes on the next manual deploy.

name: Daily update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The script exits 1 only on schema/sitemap/key problems. Changed
      # hashes and blocked pages are warnings recorded in
      # health-report.json, not failures — providers routinely block bots.
      # NEVER add --update-hashes here: a hash is accepted only for a page
      # the Gemini step verified in this same run (see
      # scripts/verify-models-gemini.mjs), never for unverified pages.
      - name: Health check (network mode)
        run: node scripts/health-check.mjs --network

      - name: Fetch AI news
        run: node scripts/fetch-news.mjs

      # Deterministic only: expires temporary offers whose recorded end date
      # passed (with a changelog entry). Never invents or changes a limit.
      - name: Update model list (deterministic only)
        run: node scripts/update-models-daily.mjs

      # Gemini verification (only when the GEMINI_API_KEY repo secret is
      # set). Strictly gated extraction from official pages: applies a
      # limit only with high confidence + a verbatim quote from the page
      # + numbers that appear in that quote, and only when it improves
      # the record (fills a "غير مؤكد" gap or brings a new number). A "no
      # free offer" verdict is NEVER auto-applied — it goes to
      # verify-report.json for the daily issue. The script exits 0 on
      # every error, so this step never fails the workflow.
      - name: Verify flagged pages with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not set — skipping Gemini verification (health issue remains the fallback)."
          else
            node scripts/verify-models-gemini.mjs
          fi

      - name: Build site
        run: npm run build

      # git status --porcelain (not git diff --quiet) so the very first
      # run also commits a file if it is still untracked. Only these four
      # files are ever staged and pushed by this workflow: the news the
      # fetch script wrote, the two files the deterministic model script
      # may change (expired offers + their changelog entries), and the
      # content hashes the Gemini step updated for pages it verified
      # this run (never for unverified pages).
      - name: Commit daily data if changed
        run: |
          if [ -z "$(git status --porcelain -- src/data/news.json src/data/apis.json src/data/changelog.json src/data/content-hashes.json)" ]; then
            echo "daily data unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/news.json src/data/apis.json src/data/changelog.json src/data/content-hashes.json
            git commit -m "Daily update $(date -u +%F)"
            git push
          fi

      # Reads health-report.json (health check) and verify-report.json
      # (Gemini step, when it ran) and prepares the issue: outputs
      # has_findings + issue_title, and writes the issue body to
      # health-issue-body.md (gitignored workspace file, never committed).
      - name: Summarize health findings
        id: health-summary
        run: node scripts/build-health-issue.mjs

      # One issue per day at most: skip when an open issue with the same
      # date-stamped title already exists.
      - name: Open health issue if pages changed or need review
        if: steps.health-summary.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="${{ steps.health-summary.outputs.issue_title }}"
          if gh issue list --limit 50 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "An issue for today already exists — skipping."
          else
            gh issue create --title "$TITLE" --body-file health-issue-body.md
          fi

      # Automatic deployment needs the two repo secrets (see the header
      # comment). When they are absent this step prints a note and
      # succeeds without deploying — data + issue only, no live change.
      # The secrets are checked in the shell, NOT in an `if:` condition:
      # GitHub's expression parser rejects the `secrets` context in
      # `if:` (422 on dispatch), while an unset secret referenced in
      # `env:` is simply an empty string. wrangler is fetched on the
      # runner with npx; it is not a project dependency, so the repo
      # stays dependency-light.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set — skipping deploy (data + issue only)."
          else
            npx wrangler pages deploy dist --project-name=free-models-directory
          fi
